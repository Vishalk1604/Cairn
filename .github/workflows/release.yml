name: Release

# Pushing a tag vX.Y.Z builds the Android app and the Windows installer,
# signs both, and publishes them to a GitHub Release under names that never
# change, so releases/latest/download/<name> is always the newest. See
# docs/release.md for the keys and secrets this needs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    name: Check the version and keys
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Firebase config and the upload key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON and ANDROID_KEYSTORE_BASE64 must be set as repository secrets (docs/release.md)"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          CI: 1
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          CAIRN_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          CAIRN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAIRN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAIRN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Phones are arm64; x86_64 is for the emulator and Chromebooks.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Check it is signed with the upload key
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key; the upload key was not used"
            exit 1
          fi
          mkdir -p out
          cp "$apk" out/Cairn-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/Cairn-android.apk
          if-no-files-found: error
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" apps/mobile/google-services.json

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build and sign the installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The updater's signature is only made here, so local builds need no key.
        run: pnpm exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Name the files and write latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          nsis=apps/desktop/src-tauri/target/release/bundle/nsis
          installer="$(find "$nsis" -maxdepth 1 -name '*-setup.exe' | head -1)"
          mkdir -p out
          cp "$installer" out/Cairn-windows-setup.exe
          cp "$installer.sig" out/Cairn-windows-setup.exe.sig
          node scripts/latest-json.mjs "$VERSION" out/Cairn-windows-setup.exe.sig \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Cairn-windows-setup.exe" out/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum Cairn-android.apk Cairn-windows-setup.exe latest.json > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Cairn $VERSION" --generate-notes \
            out/Cairn-android.apk out/Cairn-windows-setup.exe out/Cairn-windows-setup.exe.sig out/latest.json out/SHA256SUMS.txt
