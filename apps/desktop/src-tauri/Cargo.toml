[package]
name = "cairn"
version = "0.3.1"
description = "Notes and reminders that keep your next deadline visible"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = "~2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
